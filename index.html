<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDCC Bank Report System</title>
    <style>
        :root {
            --navy: #003366;
            --light-blue: #e6f3f3;
            --border-color: #c7dadd;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 15px;
            background-color: #f8f9fa;
        }

        .panel {
            border: 2px solid var(--navy);
            padding: 15px;
            background: #fff;
            border-radius: 6px;
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tablebox {
            overflow-x: auto;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .report-table th, .report-table td {
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            text-align: center;
        }

        .report-table th {
            background-color: var(--navy);
            color: white;
            font-weight: bold;
        }

        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-excel { background: #28a745; color: white; }
        .btn-print { background: #17a2b8; color: white; }
        .btn-out { background: #dc3545; color: white; }

        .btn-edit {
            background-color: #ffc107;
            color: #000;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }

        .btn-edit:hover {
            background-color: #e0a800;
        }

        .muted { color: #6c757d; }
    </style>
</head>
<body>

    <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
        <button class="btn btn-out" onclick="logout()">लॉगआउट</button>
    </div>

    <section class="panel">
        <div class="bar">
            <div>
                <h3 style="color:var(--navy); margin:0;">📊 १७ शाखांचा एकत्रित अहवाल (Consolidated Report)</h3>
                <span class="muted">भुसावळ तालुक्यातील सर्व १७ शाखांचा एकत्रित अहवाल व एकूण (Subtotal / Grand Total) पाहा.</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <label style="margin:0; font-weight:bold;">तारीख:</label>
                <input id="adminReportDate" type="date" style="width:auto; padding:4px;" onchange="renderConsolidatedReport()">
                <button class="btn btn-excel" onclick="downloadExcel()">📊 Excel</button>
                <button class="btn btn-print" onclick="printReport('A4')">🖨️ A4 Print</button>
                <button class="btn btn-print" onclick="printReport('A3')">🖨️ A3 Print</button>
            </div>
        </div>

        <div id="consolidatedReportBox" class="tablebox" style="margin-top:10px;"></div>
    </section>

    <script>
        // सर्व १७ शाखांची यादी
        var ALL_BRANCHES = [
            "भुसावळ", "वरणगाव", "पिंपळगाव बु.", "कुऱ्हे पानाचे", "साकरी", 
            "दीप्ती नगर", "बाजार समिती भुसावळ", "नशिराबाद", "फैजपूर", 
            "सावदा", "रावेर", "यावल", "मुक्ताईनगर", "बोदवड", 
            "चोपडा", "अमळनेर", "जळगाव"
        ];

        function today() {
            return new Date().toISOString().split('T')[0];
        }

        function esc(str) {
            return str ? String(str).replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        function getEntries() {
            return JSON.parse(localStorage.getItem('allEntries') || '[]');
        }

        function getRequestForDate(d) {
            var requests = JSON.parse(localStorage.getItem('allRequests') || '[]');
            return requests.find(r => r.date === d) || {
                date: d,
                columns: [
                    { title: 'संस्था नाव', subColumns: ['भाग १', 'भाग २', 'भाग ३', 'भाग ४', 'भाग ५'] },
                    { title: 'करंट खाते बॅलन्स', subColumns: ['भाग १', 'भाग २', 'भाग ३', 'भाग ४', 'भाग ५'] },
                    { title: '२% मार्जिन बॅलन्स', subColumns: ['भाग १', 'भाग २', 'भाग ३', 'भाग ४', 'भाग ५'] }
                ]
            };
        }

        document.getElementById('adminReportDate').value = today();

        // ================= MAIN REPORT RENDER FUNCTION =================
        function renderConsolidatedReport(){
            var d = document.getElementById('adminReportDate').value || today();
            var req = getRequestForDate(d);
            var allEntries = getEntries();
            var entries = [];
            for(var e=0; e<allEntries.length; e++){
                if(allEntries[e].date === d) entries.push(allEntries[e]);
            }

            var box = document.getElementById('consolidatedReportBox');

            if(!req || !req.columns || req.columns.length === 0){
                box.innerHTML = '<p class="muted">माहिती मागणीची कोणतीही माहिती उपलब्ध नाही.</p>';
                return;
            }

            var maxSubs = 1;
            req.columns.forEach(function(col){
                if(col.subColumns && col.subColumns.length > maxSubs){
                    maxSubs = col.subColumns.length;
                }
            });

            var html = '<table class="report-table"><thead>';
            var headerRow1 = '<tr><th rowspan="2">शाखेचे नाव</th><th rowspan="2">विवरण / भाग</th>';
            var headerRow2 = '<tr>';

            req.columns.forEach(function(col){
                var subs = col.subColumns || [];
                if(subs.length > 0){
                    headerRow1 += '<th colspan="' + subs.length + '">' + esc(col.title) + '</th>';
                    subs.forEach(function(sub){
                        headerRow2 += '<th>' + esc(sub) + '</th>';
                    });
                } else {
                    headerRow1 += '<th rowspan="2">' + esc(col.title) + '</th>';
                }
            });
            
            headerRow1 += '<th rowspan="2">एकूण</th></tr>';
            headerRow2 += '</tr>';

            html += headerRow1 + headerRow2 + '</thead><tbody>';

            var grandTotals = new Array(req.columns.length).fill(0);
            var grandTotalAll = 0;
            var isNumericCol = new Array(req.columns.length).fill(true);

            ALL_BRANCHES.forEach(function(bName){
                var entry = null;
                for(var k=0; k<entries.length; k++){
                    if(entries[k].branch === bName){ entry = entries[k]; break; }
                }

                var branchSubtotals = new Array(req.columns.length).fill(0);
                var branchTotalSum = 0;

                for(var sIdx = 0; sIdx < maxSubs; sIdx++){
                    var isFirstRow = (sIdx === 0);
                    html += '<tr>';

                    if(isFirstRow){
                        html += '<td rowspan="' + maxSubs + '" style="text-align:center; font-weight:600; vertical-align:middle; border:1px solid #c7dadd;">' + 
                                esc(bName) + '<br><button class="btn-edit" onclick="openAdminEditModal(\'' + bName + '\', \'' + d + '\')">✏️ Edit</button></td>';
                    }

                    var subName = 'भाग ' + (sIdx + 1);
                    html += '<td style="border:1px solid #c7dadd; background:#fbfbfb; font-size:13px; color:#555;">' + subName + '</td>';

                    var rowSum = 0;

                    req.columns.forEach(function(col, cIdx){
                        var subs = col.subColumns || [];
                        var val = '';

                        if(subs.length > 0){
                            if(sIdx < subs.length && entry && entry.data && entry.data[col.title]){
                                val = entry.data[col.title][subs[sIdx]] || '';
                            }
                        } else if(sIdx === 0 && entry && entry.data){
                            val = entry.data[col.title] || '';
                        }

                        if(val !== '' && !isNaN(val)){
                            var num = parseFloat(val);
                            branchSubtotals[cIdx] += num;
                            grandTotals[cIdx] += num;
                            rowSum += num;
                        } else if(val !== '' && isNaN(val)){
                            isNumericCol[cIdx] = false;
                        }

                        html += '<td style="text-align:center; border:1px solid #c7dadd;">' + (val !== '' ? esc(val) : '-') + '</td>';
                    });

                    branchTotalSum += rowSum;
                    html += '<td style="text-align:center; font-weight:600; border:1px solid #c7dadd;">' + (rowSum > 0 ? rowSum : '-') + '</td></tr>';
                }

                // BRANCH SUBTOTAL ROW
                html += '<tr style="background:#e6f3f3; font-weight:700; border-bottom:2px solid var(--navy);">' +
                        '<td colspan="2" style="border:1px solid #c7dadd; color:var(--navy); padding:6px 10px;">' + esc(bName) + ' एकूण (Subtotal)</td>';

                req.columns.forEach(function(col, cIdx){
                    if(isNumericCol[cIdx] && branchSubtotals[cIdx] > 0){
                        html += '<td style="text-align:center; border:1px solid #c7dadd; color:var(--navy);">' + branchSubtotals[cIdx] + '</td>';
                    } else {
                        html += '<td style="text-align:center; border:1px solid #c7dadd; color:var(--navy);">-</td>';
                    }
                });

                html += '<td style="text-align:center; border:1px solid #c7dadd; color:var(--navy);">' + (branchTotalSum > 0 ? branchTotalSum : '-') + '</td></tr>';

                grandTotalAll += branchTotalSum;
            });

            // GRAND TOTAL ROW
            html += '<tr style="background:#b8d8d8; font-weight:800; border-top:2px solid var(--navy);">' +
                    '<td colspan="2" style="border:1px solid #c7dadd; color:var(--navy); padding:8px 10px;">सर्व १७ शाखांची एकत्रित बेरीज (Grand Total)</td>';

            req.columns.forEach(function(col, cIdx){
                if(isNumericCol[cIdx] && grandTotals[cIdx] > 0){
                    html += '<td style="text-align:center; border:1px solid #c7dadd; color:var(--navy);">' + grandTotals[cIdx] + '</td>';
                } else {
                    html += '<td style="text-align:center; border:1px solid #c7dadd; color:var(--navy);">-</td>';
                }
            });

            html += '<td style="text-align:center; border:1px solid #c7dadd; color:var(--navy);">' + (grandTotalAll > 0 ? grandTotalAll : '-') + '</td></tr>';

            html += '</tbody></table>';
            box.innerHTML = html;
        }

        // ================= ADMIN EDIT MODAL FUNCTIONS =================
        function openAdminEditModal(branchName, date) {
            var allEntries = getEntries();
            var entry = allEntries.find(e => e.branch === branchName && e.date === date);

            if (!entry) {
                entry = { branch: branchName, date: date, data: {} };
            }

            var req = getRequestForDate(date);

            var modalHtml = `
                <div id="adminEditModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:1000;">
                    <div style="background:#fff; padding:20px; border-radius:8px; width:90%; max-width:550px; max-height:85vh; overflow-y:auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                        <h3 style="color:var(--navy); margin-top:0;">✏️ ${branchName} - माहिती एडिट करा</h3>
                        <form id="adminEditForm">
                            <div id="dynamicEditFields"></div>
                            <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">
                                <button type="button" onclick="closeAdminEditModal()" class="btn" style="background:#6c757d; color:#fff;">रद्द करा</button>
                                <button type="button" onclick="saveAdminChanges('${branchName}', '${date}')" class="btn" style="background:#28a745; color:#fff;">सेव्ह करा</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);

            var fieldsContainer = document.getElementById('dynamicEditFields');
            var fieldsHtml = '';

            req.columns.forEach(function(col){
                fieldsHtml += `<h4 style="margin: 10px 0 5px 0; color:var(--navy); border-bottom:1px solid #ccc; padding-bottom:3px;">${col.title}</h4>`;
                var subs = col.subColumns || [];
                
                if(subs.length > 0){
                    subs.forEach(function(sub){
                        var val = (entry.data && entry.data[col.title] && entry.data[col.title][sub]) ? entry.data[col.title][sub] : '';
                        fieldsHtml += `
                            <div style="margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                                <label style="font-size:13px;">${sub}: </label>
                                <input type="text" data-parent="${col.title}" data-child="${sub}" value="${val}" class="admin-input" style="width:60%; padding:5px; border:1px solid #ccc; border-radius:4px;">
                            </div>`;
                    });
                } else {
                    var val = (entry.data && entry.data[col.title]) ? entry.data[col.title] : '';
                    fieldsHtml += `
                        <div style="margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                            <label style="font-size:13px;">${col.title}: </label>
                            <input type="text" data-parent="${col.title}" value="${val}" class="admin-input" style="width:60%; padding:5px; border:1px solid #ccc; border-radius:4px;">
                        </div>`;
                }
            });

            fieldsContainer.innerHTML = fieldsHtml;
        }

        function saveAdminChanges(branchName, date) {
            var allEntries = getEntries();
            var entryIndex = allEntries.findIndex(e => e.branch === branchName && e.date === date);

            if (entryIndex === -1) {
                allEntries.push({ branch: branchName, date: date, data: {} });
                entryIndex = allEntries.length - 1;
            }

            var inputs = document.querySelectorAll('.admin-input');
            inputs.forEach(input => {
                var parent = input.getAttribute('data-parent');
                var child = input.getAttribute('data-child');
                var value = input.value.trim();

                if (!allEntries[entryIndex].data) allEntries[entryIndex].data = {};

                if (child) {
                    if (!allEntries[entryIndex].data[parent]) allEntries[entryIndex].data[parent] = {};
                    allEntries[entryIndex].data[parent][child] = value;
                } else {
                    allEntries[entryIndex].data[parent] = value;
                }
            });

            localStorage.setItem('allEntries', JSON.stringify(allEntries));
            alert("माहिती यशस्वीरीत्या अपडेट केली!");
            closeAdminEditModal();
            renderConsolidatedReport();
        }

        function closeAdminEditModal() {
            var modal = document.getElementById('adminEditModal');
            if (modal) modal.remove();
        }

        function logout() {
            alert("लॉगआउट झाले!");
        }

        function downloadExcel() { alert("Excel डाऊनलोड सुरू होत आहे..."); }
        function printReport(type) { window.print(); }

        // पेज लोड झाल्यावर रिपोर्ट दाखवणे
        renderConsolidatedReport();
    </script>
</body>
</html>
